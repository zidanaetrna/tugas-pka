name: Build dan push image Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_IMAGE: docker.io/itsaetrna/pka-knn-missing-values
      GHCR_IMAGE: ghcr.io/zidanaetrna/pka-knn-missing-values
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: itsaetrna
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Susun daftar tag
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "$GHCR_IMAGE:1.0"
            echo "$GHCR_IMAGE:latest"
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "$DOCKERHUB_IMAGE:1.0"
              echo "$DOCKERHUB_IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::Secret DOCKERHUB_TOKEN belum di-set, image hanya di-push ke GHCR."
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=pka-knn-missing-values
          cache-from: type=gha
          cache-to: type=gha,mode=max
